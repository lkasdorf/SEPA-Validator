[package]
name = "app"
description = "Validates SEPA payment XML files against ISO 20022 XSD schemas"
authors = ["Leon Kasdorf"]
license = "MIT"
repository = "https://github.com/lkasdorf/SEPA-Validator"
edition = "2021"
rust-version = "1.85"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["rlib"] # desktop only; staticlib/cdylib were for mobile builds

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
libxml = "0.3"
quick-xml = "0.36"
walkdir = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
